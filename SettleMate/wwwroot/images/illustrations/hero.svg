  </g>
  <g stroke="#fff" stroke-width="4"><path d="M216 250v40M196 270h40M344 250v40M324 270h40"/></g>
  <!-- path + ground -->
  <path d="M60 386h440" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 386c-20 22 30 30 0 52s-40 22-60 30" fill="none" stroke="#8fe3d3" stroke-width="16" stroke-linecap="round"/>
