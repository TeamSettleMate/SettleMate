  <circle cx="470" cy="92" r="34" fill="#fde7c4"/>
  <circle cx="470" cy="92" r="20" fill="#f6c46b"/>
  <!-- clouds -->
  <g fill="#fff">
    <ellipse cx="140" cy="96" rx="44" ry="16"/><ellipse cx="164" cy="86" rx="26" ry="16"/>
    <ellipse cx="392" cy="150" rx="36" ry="12"/><ellipse cx="410" cy="142" rx="20" ry="12"/>
  </g>
  <!-- background buildings -->
  <g fill="#b9e6dc">
