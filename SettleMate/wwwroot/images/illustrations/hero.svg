    <rect x="82" y="252" width="12" height="14" rx="2"/><rect x="104" y="252" width="12" height="14" rx="2"/>
    <rect x="82" y="278" width="12" height="14" rx="2"/><rect x="104" y="278" width="12" height="14" rx="2"/>
    <rect x="424" y="206" width="14" height="16" rx="2"/><rect x="452" y="206" width="14" height="16" rx="2"/>
    <rect x="424" y="236" width="14" height="16" rx="2"/><rect x="452" y="236" width="14" height="16" rx="2"/>
    <rect x="424" y="266" width="14" height="16" rx="2"/><rect x="452" y="266" width="14" height="16" rx="2"/>
  </g>
