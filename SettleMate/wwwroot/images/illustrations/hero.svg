    <rect x="22" y="70" width="12" height="48" rx="6" fill="#0a3f3b"/><rect x="38" y="70" width="12" height="48" rx="6" fill="#0a3f3b"/>
    <path d="M16 36c0-14 10-22 20-22s20 8 20 22v38H16Z" fill="#f2836b"/>
    <circle cx="36" cy="0" r="14" fill="#c68b63"/>
    <path d="M22-4c0-12 8-18 15-18s15 6 15 16c-6-4-20-4-30 2Z" fill="#1f1a17"/>
    <rect x="44" y="34" width="38" height="32" rx="4" fill="#f6c46b"/>
