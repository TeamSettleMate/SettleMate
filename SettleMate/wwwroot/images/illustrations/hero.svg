  <path d="M152 244 280 140l128 104" fill="none" stroke="#0a3f3b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="338" y="160" width="22" height="40" rx="3" fill="#0a3f3b"/>
  <path d="M349 132c-6-6-14-1-10 6l10 10 10-10c4-7-4-12-10-6Z" fill="#8fe3d3"/>
  <rect x="250" y="290" width="60" height="96" rx="30" fill="#0f766e"/>
  <circle cx="296" cy="340" r="4" fill="#8fe3d3"/>
